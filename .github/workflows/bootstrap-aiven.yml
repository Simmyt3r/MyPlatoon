name: Bootstrap Aiven MyPlatoon administrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      FLASK_ENV: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      ADMIN_INIT_EMAIL: ${{ secrets.ADMIN_INIT_EMAIL }}
      ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
      SECRET_KEY: action-bootstrap-only-not-web-session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check environment
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$ADMIN_INIT_EMAIL" ] || [ -z "$ADMIN_INIT_PASSWORD" ]; then
            echo "Set DATABASE_URL_UNPOOLED, ADMIN_INIT_EMAIL and ADMIN_INIT_PASSWORD in the production environment." >&2
            exit 1
          fi
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize first administrator and business categories
        run: python scripts/bootstrap_aiven.py
