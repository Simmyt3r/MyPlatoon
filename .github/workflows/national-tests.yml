name: MyPlatoon nationwide regression tests

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "requirements.txt"
      - ".github/workflows/national-tests.yml"
  pull_request:
  workflow_dispatch:

# Run only the most recent push/PR on a branch; old queued runs cannot
# certify the latest tree and can exhaust the available runner quota.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Compile application and migrations
        run: python -m compileall -q app migrations/versions tests
      - name: Run all pytest tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: github-actions-testing-key
        run: python -m pytest -q
      - name: Verify upgrade against a fresh database
        env:
          FLASK_APP: wsgi.py
          FLASK_ENV: development
          AUTO_CREATE_TABLES: "false"
          SECRET_KEY: github-actions-migration-key
          DATABASE_URL: sqlite:////tmp/myplatoon-migrations-test.db
        run: |
          python -m flask db upgrade
          python - <<'PY'
          from app import create_app
          from sqlalchemy import inspect
          from app.models import Platoon, Profile, AlbumVersion
          from app.extensions import db
          app = create_app("development")
          with app.app_context():
              assert db.session.query(Platoon).count() == 0
              assert db.session.query(Profile).count() == 0
              assert db.session.query(AlbumVersion).count() == 0
              inspector = inspect(db.engine)
              assert inspector.has_table("gig_disputes")
              assert inspector.has_table("gig_dispute_evidence")
              assert inspector.has_table("gig_dispute_events")
              assert inspector.has_table("gig_work_updates")
              assert inspector.has_table("gig_termination_requests")
              names = {col["name"] for col in inspector.get_columns("gig_disputes")}
              assert {"category", "outcome_code"}.issubset(names)
          PY
          python scripts/check_release_schema.py
