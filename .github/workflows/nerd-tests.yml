name: NERD feature tests

on:
  push:
    paths:
      - "app/**"
      - "tests/test_nerd.py"
      - "requirements.txt"
      - ".github/workflows/nerd-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/test_nerd.py"
      - "requirements.txt"
      - ".github/workflows/nerd-tests.yml"

jobs:
  nerd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app tests/test_nerd.py
      - name: Test NERD pages and navigation
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-only-key
        run: python -m pytest -q tests/test_nerd.py
